<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#fbf7ef">
<title>認字溫習樂園 · 中文複習</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Nunito:wght@400;600;700;800&family=Noto+Sans+TC:wght@500;700;800&display=swap">
<style>
:root {
  --bg: #fbf7ef;
  --bg-2: #f3ecdf;
  --surface: #ffffff;
  --surface-2: #f6f1e6;
  --ink: #2b2a26;
  --muted: #8c8677;
  --line: #e9e2d3;
  --green: #5f9e63;
  --green-deep: #3f7a49;
  --orange: #e08a4e;
  --blue: #6a9bcc;
  --yellow: #f2c14e;
  --red: #d9663f;
  --purple: #8a76c4;
  --teal: #4ecdc4;
  --radius: 22px;
  --radius-lg: 30px;
  --shadow: 0 14px 34px -16px rgba(70, 58, 34, 0.35);
  --shadow-sm: 0 6px 16px -10px rgba(70, 58, 34, 0.4);
  --font: "Outfit", ui-rounded, "Nunito", "Noto Sans TC", system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
button, .topic, .option, .backbtn, .next-btn, .iconbtn, .vcard { touch-action: manipulation; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font);
  background:
    radial-gradient(1200px 600px at 50% -10%, #fffdf7 0%, transparent 60%),
    linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
  color: var(--ink);
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
}
.app {
  width: 100%;
  max-width: 480px;
  margin: 0 auto;
  min-height: 100dvh;
  padding: 18px 18px 30px;
  position: relative;
}
.hidden { display: none !important; }

/* ---------- Header ---------- */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.topbar .who { display: flex; align-items: center; gap: 12px; }
.avatar {
  width: 46px; height: 46px; border-radius: 50%;
  display: grid; place-items: center;
  color: #fff; font-weight: 800; font-size: 20px;
  box-shadow: var(--shadow-sm); background: var(--orange);
}
.greet { font-size: 13px; color: var(--muted); }
.name { font-size: 19px; font-weight: 700; letter-spacing: -0.01em; }
.iconbtn {
  border: 1px solid var(--line); background: var(--surface);
  border-radius: 14px; width: 44px; height: 44px;
  display: grid; place-items: center; color: var(--ink);
  cursor: pointer; box-shadow: var(--shadow-sm);
  transition: transform 0.15s cubic-bezier(0.16, 1, 0.3, 1);
  font-family: inherit; font-size: 18px;
}
.iconbtn:active { transform: scale(0.94); }
.backbtn {
  border: 1px solid var(--line); background: var(--surface);
  border-radius: 14px; width: 44px; height: 44px;
  display: grid; place-items: center;
  cursor: pointer; box-shadow: var(--shadow-sm);
  font-family: inherit; font-size: 18px; color: var(--ink);
  flex: none;
}

/* ---------- Cards ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow);
  padding: 18px 18px 20px;
}
.hero-card {
  background: linear-gradient(135deg, #5f9e63 0%, #3f7a49 100%);
  color: #fff; border: none; position: relative; overflow: hidden;
}
.hero-card::before {
  content: "📖"; position: absolute; right: -12px; bottom: -22px;
  font-size: 130px; opacity: 0.18; transform: rotate(-12deg);
  pointer-events: none; z-index: 0;
}
.hero-card > * { position: relative; z-index: 1; }
.hero-card .hero-greet { font-size: 14px; opacity: 0.85; }
.hero-card .hero-title { font-size: 22px; font-weight: 800; margin-top: 4px; letter-spacing: -0.01em; }
.hero-card .hero-sub { font-size: 13px; opacity: 0.85; margin-top: 6px; }
.hero-card .ring-mini {
  margin-top: 14px; display: flex; align-items: center; gap: 10px;
  background: rgba(255, 255, 255, 0.18); border-radius: 999px;
  padding: 8px 14px; font-size: 13px; font-weight: 700; width: fit-content;
}
.section-label {
  font-size: 13px; font-weight: 800; color: var(--muted);
  letter-spacing: 0.06em; margin: 22px 4px 10px;
}

/* ---------- Topic list ---------- */
.topic-grid { display: grid; gap: 12px; }
.topic {
  display: flex; align-items: center; gap: 14px;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 16px;
  box-shadow: var(--shadow-sm); cursor: pointer;
  transition: transform 0.15s cubic-bezier(0.16, 1, 0.3, 1);
  position: relative; overflow: hidden;
}
.topic:active { transform: scale(0.98); }
.topic .tbadge {
  width: 50px; height: 50px; border-radius: 16px;
  display: grid; place-items: center; color: #fff;
  font-size: 24px; font-weight: 800; flex: none;
  box-shadow: 0 6px 14px -8px rgba(0, 0, 0, 0.4);
}
.topic .tinfo { flex: 1; min-width: 0; }
.topic .tname { font-weight: 800; font-size: 16px; letter-spacing: -0.01em; }
.topic .tdesc { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.topic .tstar { font-size: 13px; font-weight: 700; color: var(--muted); display: flex; align-items: center; gap: 4px; }
.topic .tstar.gold { color: #b8852c; }

/* ---------- Vocab (生字) view ---------- */
.vocab-head { text-align: center; padding: 6px 0 2px; }
.vocab-head .vicon {
  width: 64px; height: 64px; margin: 0 auto 10px;
  border-radius: 20px; display: grid; place-items: center;
  font-size: 32px; color: #fff;
  box-shadow: 0 10px 22px -12px rgba(0,0,0,0.5);
}
.vocab-head .vname { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; }
.vocab-head .vdesc { color: var(--muted); font-size: 13px; margin-top: 4px; }

.vocab-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(88px, 1fr));
  gap: 10px;
  margin-top: 12px;
}
.vcard {
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: 16px;
  padding: 12px 6px 10px;
  text-align: center;
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  transition: transform 0.15s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.2s;
  position: relative;
  overflow: hidden;
}
.vcard:active { transform: scale(0.95); }
.vcard .vc-char {
  font-size: 36px; font-weight: 800; line-height: 1.1;
  letter-spacing: 0.02em;
}
.vcard .vc-sub { font-size: 11.5px; color: var(--muted); margin-top: 4px; font-weight: 700; }
.vcard .vc-ex { font-size: 11px; color: var(--green-deep); margin-top: 2px; }
.vcard.tone-1 { border-color: #cfe0f2; }
.vcard.tone-2 { border-color: #d8efe2; }
.vcard.tone-3 { border-color: #fbe7c6; }
.vcard.tone-4 { border-color: #f5d3c8; }

.vocab-actions { margin-top: 22px; display: grid; gap: 10px; }

/* ---------- Study (認字卡) ---------- */
.study-stage { text-align: center; padding: 6px 0 0; }
.study-card {
  width: 230px; height: 270px; margin: 10px auto 6px;
  background: var(--surface);
  border: 3px solid var(--line);
  border-radius: 30px;
  box-shadow: var(--shadow);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  cursor: pointer; position: relative;
  transition: transform 0.18s cubic-bezier(0.16,1,0.3,1), border-color 0.3s;
  user-select: none;
}
.study-card:active { transform: scale(0.97); }
.study-card.revealed { border-color: var(--green); }
.study-char {
  font-size: 118px; font-weight: 800; line-height: 1;
  letter-spacing: 0.02em;
  transition: font-size 0.25s cubic-bezier(0.16,1,0.3,1);
}
.study-card.revealed .study-char { font-size: 76px; }
.study-reveal { margin-top: 12px; animation: pop 0.3s cubic-bezier(0.34,1.56,0.64,1); }
.study-jyut { font-size: 22px; color: var(--green-deep); font-weight: 800; letter-spacing: 0.02em; }
.study-ex { font-size: 15px; color: var(--muted); margin-top: 6px; font-weight: 700; }
.study-hint { color: var(--muted); font-size: 13px; margin-top: 12px; min-height: 18px; font-weight: 700; }
.speaker {
  width: 78px; height: 78px; border-radius: 50%; border: none;
  margin: 16px auto 4px; display: grid; place-items: center;
  background: linear-gradient(180deg, #eef7ee, #dcefdc);
  color: var(--green-deep); cursor: pointer;
  box-shadow: var(--shadow); font-size: 32px;
  transition: transform 0.15s cubic-bezier(0.16,1,0.3,1);
}
.speaker:active { transform: scale(0.92); }
.speaker.playing { animation: pulse 1s ease-in-out infinite; }
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(95,158,99,0.35), var(--shadow); }
  50% { box-shadow: 0 0 0 16px rgba(95,158,99,0), var(--shadow); }
}
.study-nav { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
.study-nav .btn { border-radius: 16px; padding: 14px 12px; font-size: 15px; }
.btn {
  border: none; border-radius: 18px; padding: 16px 20px;
  font-family: inherit; font-size: 17px; font-weight: 800;
  color: #fff; background: var(--green); cursor: pointer; width: 100%;
  box-shadow: 0 12px 24px -14px rgba(63, 122, 73, 0.9);
  transition: transform 0.15s cubic-bezier(0.16, 1, 0.3, 1);
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
}
.btn:active { transform: scale(0.97); }
.btn.ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--line); box-shadow: var(--shadow-sm); }

/* ---------- Game ---------- */
.learn-top { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
.progress-lane {
  flex: 1; height: 12px; border-radius: 999px;
  background: var(--surface-2); border: 1px solid var(--line); overflow: hidden;
}
.progress-lane > i {
  display: block; height: 100%; width: 0;
  background: linear-gradient(90deg, var(--green), #7cc07f);
  transition: width 0.35s cubic-bezier(0.16, 1, 0.3, 1);
}
.count { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 14px; }
.qtype-tag {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--surface-2); border: 1px solid var(--line);
  border-radius: 999px; padding: 6px 12px;
  font-size: 12.5px; font-weight: 700; color: var(--muted);
}
.q-card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius-lg); box-shadow: var(--shadow);
  padding: 24px 20px; margin-top: 12px; text-align: center;
  position: relative; overflow: hidden;
}
.q-prompt { font-size: 14px; color: var(--muted); margin-bottom: 12px; font-weight: 700; }
.q-char-lg { font-size: 76px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; margin: 6px 0; }
.q-jyut { color: var(--muted); font-size: 16px; margin-top: 4px; font-weight: 700; }
.q-sentence { font-size: 23px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.6; margin: 12px 0; }
.q-sentence .blank {
  display: inline-block; min-width: 48px; padding: 0 6px;
  border-bottom: 3px solid var(--orange); margin: 0 2px;
}
.q-chars-row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 14px; }
.q-char-card {
  width: 72px; height: 84px; border: 2px solid var(--line);
  border-radius: 16px; display: grid; place-items: center;
  font-size: 40px; font-weight: 800; background: var(--surface-2);
}
.options { display: grid; gap: 10px; margin-top: 16px; }
.option {
  border: 1.5px solid var(--line); background: var(--surface);
  border-radius: 18px; padding: 16px; font-size: 19px; font-weight: 700;
  cursor: pointer; box-shadow: var(--shadow-sm);
  font-family: inherit; color: var(--ink); text-align: center;
  transition: transform 0.15s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.2s, background 0.2s;
}
.option:active { transform: scale(0.98); }
.option.right { border-color: var(--green); background: #eef8ee; color: var(--green-deep); }
.option.wrong { border-color: var(--red); background: #fdeee9; color: var(--red); }
.option.dim { opacity: 0.45; }
.feedback {
  margin-top: 14px; border-radius: 16px; padding: 14px 16px;
  font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 10px;
  animation: pop 0.32s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.feedback.good { background: #eef8ee; color: var(--green-deep); border: 1px solid #cfe7cf; }
.feedback.bad { background: #fdeee9; color: var(--red); border: 1px solid #f5d3c8; }
.feedback .ans { font-weight: 800; }
.next-btn {
  margin-top: 14px; border: none; border-radius: 18px; padding: 16px 20px;
  font-family: inherit; font-size: 17px; font-weight: 800; color: #fff;
  background: var(--green); cursor: pointer; width: 100%;
  box-shadow: 0 12px 24px -14px rgba(63, 122, 73, 0.9);
  transition: transform 0.15s; display: flex; align-items: center; justify-content: center; gap: 8px;
}
.next-btn:active { transform: scale(0.97); }

/* ---------- Result ---------- */
.result-card { text-align: center; padding: 30px 22px; }
.result-emoji { font-size: 78px; line-height: 1; }
.result-title { font-size: 24px; font-weight: 800; margin-top: 10px; letter-spacing: -0.02em; }
.result-sub { color: var(--muted); font-size: 14px; margin-top: 4px; }
.result-score {
  display: inline-flex; align-items: baseline; gap: 6px; margin: 20px 0 8px;
  background: var(--surface-2); border: 1px solid var(--line);
  border-radius: 999px; padding: 10px 22px; font-variant-numeric: tabular-nums;
}
.result-score .v { font-size: 30px; font-weight: 800; color: var(--green-deep); }
.result-score .t { font-size: 16px; color: var(--muted); }
.stars { display: flex; justify-content: center; gap: 8px; margin: 18px 0 10px; font-size: 42px; }
.stars .star.earned { animation: starpop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
.stars .star.earned:nth-child(2) { animation-delay: 0.2s; }
.stars .star.earned:nth-child(3) { animation-delay: 0.4s; }
@keyframes starpop {
  0% { transform: scale(0) rotate(-180deg); opacity: 0; }
  60% { transform: scale(1.3) rotate(10deg); }
  100% { transform: scale(1) rotate(0); opacity: 1; }
}
.action-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
.action-row .btn { border-radius: 16px; padding: 14px 16px; font-size: 15px; }

/* ---------- Confetti ---------- */
.confetti-piece { position: fixed; width: 10px; height: 14px; pointer-events: none; z-index: 50; }

/* ---------- Animations ---------- */
.pop { animation: pop 0.32s cubic-bezier(0.34, 1.56, 0.64, 1); }
@keyframes pop { 0% { transform: scale(0.92); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
.shake { animation: shake 0.36s ease-in-out; }
@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="app">

  <!-- ============ HOME ============ -->
  <div id="home-view">
    <div class="topbar">
      <div class="who">
        <div class="avatar">細</div>
        <div>
          <div class="greet">溫習時間</div>
          <div class="name">認字溫習樂園</div>
        </div>
      </div>
      <button class="iconbtn" id="reset-btn" title="重設">↻</button>
    </div>

    <div class="card hero-card">
      <div class="hero-greet">我的中國</div>
      <div class="hero-title">8 個主題 · 邊玩邊學</div>
      <div class="hero-sub">撳入主題睇生字卡，然後挑戰自己 ⭐</div>
      <div class="ring-mini" id="total-progress">⭐ 0 / 24 粒星</div>
    </div>

    <div class="section-label">選擇課題</div>
    <div class="topic-grid" id="topic-grid"></div>

    <div style="text-align:center; margin-top: 22px; font-size: 12px; color: var(--muted);">
      每個課題完成可得 1–3 粒星 · 答得快答啱拎滿分
    </div>
  </div>

  <!-- ============ VOCAB (生字卡) ============ -->
  <div id="vocab-view" class="hidden">
    <div class="topbar">
      <button class="backbtn" id="vocab-back">←</button>
      <div style="flex:1"></div>
      <div class="count" id="vocab-count"></div>
    </div>
    <div class="vocab-head">
      <div class="vicon" id="vocab-icon">📖</div>
      <div class="vname" id="vocab-name"></div>
      <div class="vdesc" id="vocab-desc"></div>
    </div>
    <div class="section-label">本課生字 · 撳吓每個字</div>
    <div class="vocab-grid" id="vocab-grid"></div>
    <div class="vocab-actions">
      <button class="btn" id="start-study-btn">🃏 開始認字</button>
      <button class="btn ghost" id="start-quiz-btn">✏️ 開始挑戰</button>
    </div>
  </div>

  <!-- ============ STUDY (認字卡) ============ -->
  <div id="study-view" class="hidden">
    <div class="topbar">
      <button class="backbtn" id="study-back">←</button>
      <div style="flex:1"></div>
      <div class="count" id="study-counter"></div>
    </div>
    <div class="study-stage">
      <div class="study-card" id="study-card">
        <div class="study-char" id="study-char"></div>
        <div class="study-reveal hidden" id="study-reveal">
          <div class="study-jyut" id="study-jyut"></div>
          <div class="study-ex" id="study-ex"></div>
        </div>
      </div>
      <div class="study-hint" id="study-hint">撳吓個字睇讀音</div>
      <button class="speaker" id="study-speak" title="聽讀音">🔊</button>
    </div>
    <div class="study-nav">
      <button class="btn ghost" id="study-prev">← 上一個</button>
      <button class="btn" id="study-next">下一個 →</button>
    </div>
  </div>

  <!-- ============ GAME ============ -->
  <div id="game-view" class="hidden">
    <div class="learn-top">
      <button class="backbtn" id="back-btn">←</button>
      <div class="progress-lane"><i id="progress-bar"></i></div>
      <div class="count" id="q-counter">0 / 8</div>
    </div>
    <div class="q-card" id="q-card"></div>
    <div class="options" id="options"></div>
    <div id="feedback" class="feedback hidden"></div>
    <button class="next-btn hidden" id="next-btn">下一題 →</button>
  </div>

  <!-- ============ RESULT ============ -->
  <div id="result-view" class="hidden">
    <div class="topbar">
      <button class="backbtn" id="back-home">←</button>
      <div style="flex:1"></div>
    </div>
    <div class="card result-card">
      <div class="result-emoji" id="r-emoji">🎉</div>
      <div class="result-title" id="r-title">完成晒！</div>
      <div class="result-sub" id="r-sub"></div>
      <div class="result-score"><span class="v" id="r-score">0</span><span class="t" id="r-total">/ 8 分</span></div>
      <div class="stars" id="r-stars"></div>
      <div class="action-row">
        <button class="btn ghost" id="retry-btn">再玩一次</button>
        <button class="btn" id="back-home-2">揀其他課題</button>
      </div>
    </div>
  </div>

</div>

<script>
// ============================================================
// DATA — 7 個課題，生字全部嚟自溫習 worksheet
// ============================================================

const TOPICS = [
  {
    id: "tone",
    name: "聲調變化",
    desc: "陰平 · 陽平 · 上聲 · 去聲",
    icon: "🎵",
    color: "#6a9bcc",
    vocabLabel: "四聲例字",
    vocab: [
      { c: "媽", sub: "maa¹", ex: "陰平聲" },
      { c: "花", sub: "faa¹", ex: "陰平聲" },
      { c: "雞", sub: "gai¹", ex: "陰平聲" },
      { c: "水", sub: "seoi²", ex: "陽平聲" },
      { c: "火", sub: "fo²", ex: "陽平聲" },
      { c: "兔", sub: "tou³", ex: "上聲" },
      { c: "茶", sub: "caa⁴", ex: "去聲" },
      { c: "魚", sub: "jyu⁴", ex: "去聲" }
    ],
    qs: [

const MYCHINA = {
  id: "mychina",
  name: "我的中國",
  desc: "綜合認字 · 全部生字",
  icon: "🏮",
  color: "#d9663f",
  vocabLabel: "全部生字",
  vocab: [],
  qs: []
};
TOPICS.forEach(t => {
  MYCHINA.vocab.push(...t.vocab);
  MYCHINA.qs.push(...t.qs);
});
TOPICS.unshift(MYCHINA);

const STAR_THRESHOLDS = [0.95, 0.75, 0.5];

// ============================================================
// STATE
// ============================================================
const STORE_KEY = "kcr_state_v1";
function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE_KEY) || "{}");
    return { best: s.best || {}, events: s.events || [] };
  } catch { return { best: {}, events: [] }; }
}
function saveState(state) {
  try { localStorage.setItem(STORE_KEY, JSON.stringify({ best: state.best, events: state.events || [] })); } catch {}
}
function getBest(topicId) {
  const s = loadState();
  return (s.best && s.best[topicId]) || 0;
}
function setBest(topicId, score) {
  const s = loadState();
  s.best[topicId] = Math.max(s.best[topicId] || 0, score);
  saveState(s);
}
function computeStars(score, total) {
  const ratio = score / total;
  if (ratio >= STAR_THRESHOLDS[0]) return 3;
  if (ratio >= STAR_THRESHOLDS[1]) return 2;
  if (ratio >= STAR_THRESHOLDS[2]) return 1;
  return 0;
}

// ============================================================
// HOME
// ============================================================
function renderHome() {
  const grid = document.getElementById("topic-grid");
  grid.innerHTML = "";
  TOPICS.forEach(t => {
    const best = getBest(t.id);
    const total = t.qs.length;
    const starText = best ? `⭐ ${best}/${total}` : "未挑戰";
    const div = document.createElement("div");
    div.className = "topic";
    div.dataset.topic = t.id;
    div.innerHTML = `
      <div class="tbadge" style="background:${t.color}">${t.icon}</div>
      <div class="tinfo">
        <div class="tname">${t.name}</div>
        <div class="tdesc">${t.desc}</div>
      </div>
      <div class="tstar ${best ? 'gold' : ''}">${starText}</div>
    `;
    div.addEventListener("click", () => openVocab(t.id));
    grid.appendChild(div);
  });
  updateTotalProgress();
}
function updateTotalProgress() {
  const earned = TOPICS.reduce((sum, t) => {
    const b = getBest(t.id);
    return sum + (b ? computeStars(b, t.qs.length) : 0);
  }, 0);
  const max = TOPICS.length * 3;
  document.getElementById("total-progress").textContent = `⭐ ${earned} / ${max} 粒星`;
}

// VOCAB (生字卡)
// ============================================================
let currentTopic = null;
function openVocab(id) {
  currentTopic = TOPICS.find(t => t.id === id);
  const t = currentTopic;

  document.getElementById("vocab-icon").textContent = t.icon;
  document.getElementById("vocab-icon").style.background = t.color;
  document.getElementById("vocab-name").textContent = t.name;
  document.getElementById("vocab-desc").textContent = t.desc;
  document.getElementById("vocab-count").textContent = `${t.vocab.length} 個生字`;

  const grid = document.getElementById("vocab-grid");
  grid.innerHTML = "";
  t.vocab.forEach((v, i) => {
    const card = document.createElement("div");
    card.className = "vcard";
    card.innerHTML = `
      <div class="vc-char">${v.c}</div>
      <div class="vc-sub">${v.sub || ""}</div>
      <div class="vc-ex">${v.ex || ""}</div>
    `;
    card.addEventListener("click", () => { studyIdx = i; openStudy(); });
    grid.appendChild(card);
  });

  showView("vocab-view");
}

// ============================================================
// STUDY (認字卡)
// ============================================================
let studyIdx = 0;
let studyRevealed = false;
let ttsVoice = null;

function pickVoice() {
  if (!window.speechSynthesis) return null;
  const vs = speechSynthesis.getVoices();
  return vs.find(v => /zh[-_]HK|yue|粵|cantonese/i.test(v.lang + v.name))
      || vs.find(v => /zh[-_]TW|zh[-_]CN|cmn/i.test(v.lang))
      || vs.find(v => /zh/i.test(v.lang))
      || null;
}
if (window.speechSynthesis) {
  pickVoice() && (ttsVoice = pickVoice());
  speechSynthesis.onvoiceschanged = () => { ttsVoice = pickVoice(); };
}

function openStudy() {
  studyRevealed = false;
  showView("study-view");
  renderStudyCard();
}

function renderStudyCard() {
  const t = currentTopic;
  const v = t.vocab[studyIdx];
  const card = document.getElementById("study-card");
  document.getElementById("study-char").textContent = v.c;
  document.getElementById("study-jyut").textContent = v.sub || "";
  document.getElementById("study-ex").textContent = v.ex || "";
  document.getElementById("study-counter").textContent = `${studyIdx + 1} / ${t.vocab.length}`;
  document.getElementById("study-reveal").classList.toggle("hidden", !studyRevealed);
  card.classList.toggle("revealed", studyRevealed);
  document.getElementById("study-hint").textContent = studyRevealed ? "" : "撳吓個字睇讀音";
}

function revealStudy() {
  studyRevealed = !studyRevealed;
  renderStudyCard();
}
function nextStudy() {
  studyIdx = (studyIdx + 1) % currentTopic.vocab.length;
  studyRevealed = false;
  renderStudyCard();
}
function prevStudy() {
  studyIdx = (studyIdx - 1 + currentTopic.vocab.length) % currentTopic.vocab.length;
  studyRevealed = false;
  renderStudyCard();
}
function speakStudy() {
  const v = currentTopic.vocab[studyIdx];
  const text = v.say || v.c; // 讀個字本身（唔讀例詞/聲調名）
  if (!window.speechSynthesis) {
    // graceful fallback: just reveal
    if (!studyRevealed) { studyRevealed = true; renderStudyCard(); }
    return;
  }
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "zh-HK";
    u.rate = 0.85;
    if (ttsVoice) u.voice = ttsVoice;
    const sp = document.getElementById("study-speak");
    sp.classList.add("playing");
    u.onend = () => sp.classList.remove("playing");
    u.onerror = () => sp.classList.remove("playing");
    speechSynthesis.speak(u);
  } catch (e) { /* ignore */ }
}

// ============================================================
// GAME
// ============================================================
let currentQs = [], currentIdx = 0, currentScore = 0, answered = false;

function startQuiz() {
  let qs = [...currentTopic.qs].sort(() => Math.random() - 0.5);
  if (qs.length > 10) qs = qs.slice(0, 10); // 綜合課題限 10 題
  currentQs = qs;
  currentIdx = 0; currentScore = 0; answered = false;
  showView("game-view");
  renderQuestion();
}

function renderQuestion() {
  const q = currentQs[currentIdx];
  answered = false;
  document.getElementById("q-counter").textContent = `${currentIdx + 1} / ${currentQs.length}`;
  document.getElementById("progress-bar").style.width = (currentIdx / currentQs.length) * 100 + "%";

  const card = document.getElementById("q-card");
  let html = `<div class="qtype-tag">${currentTopic.icon} ${currentTopic.name}</div>`;
  html += `<div class="q-prompt">${q.prompt}</div>`;
  if (q.display) html += `<div class="q-char-lg">${q.display}</div>`;
  if (q.sub) html += `<div class="q-jyut">${q.sub}</div>`;
  if (q.sentence) html += `<div class="q-sentence">${q.sentence}</div>`;
  if (q.chars) {
    html += `<div class="q-chars-row">` + q.chars.map(c =>
      `<div class="q-char-card">${c}</div>`).join("") + `</div>`;
  }
  card.innerHTML = html;
  card.style.borderTop = `4px solid ${currentTopic.color}`;

  const opts = document.getElementById("options");
  opts.innerHTML = "";
  q.opts.forEach((label, i) => {
    const btn = document.createElement("button");
    btn.className = "option";
    btn.type = "button";
    btn.textContent = label;
    btn.addEventListener("click", () => answer(i, btn));
    opts.appendChild(btn);
  });
  document.getElementById("feedback").classList.add("hidden");
  document.getElementById("next-btn").classList.add("hidden");
}

function answer(i, btn) {
  if (answered) return;
  answered = true;
  const q = currentQs[currentIdx];
  const correct = i === q.a;
  const allOpts = document.querySelectorAll("#options .option");
  if (correct) {
    currentScore++;
    btn.classList.add("right");
    showFeedback(true, q.opts[q.a]);
    burstConfetti(btn);
  } else {
    btn.classList.add("wrong", "shake");
    allOpts[q.a].classList.add("right");
    allOpts.forEach((o, idx) => { if (idx !== i && idx !== q.a) o.classList.add("dim"); });
    showFeedback(false, q.opts[q.a]);
  }
  document.getElementById("next-btn").classList.remove("hidden");
}
function showFeedback(good, ans) {
  const fb = document.getElementById("feedback");
  fb.className = `feedback ${good ? "good" : "bad"}`;
  fb.innerHTML = good
    ? `✅ 答啱晒！<span class="ans">${ans}</span>`
    : `❌ 答錯喇，正確係：<span class="ans">${ans}</span>`;
  fb.classList.remove("hidden");
}
function nextQuestion() {
  currentIdx++;
  if (currentIdx >= currentQs.length) finishQuiz();
  else renderQuestion();
}

function finishQuiz() {
  setBest(currentTopic.id, currentScore);
  const total = currentQs.length;
  const stars = computeStars(currentScore, total);
  showView("result-view");
  document.getElementById("r-score").textContent = currentScore;
  document.getElementById("r-total").textContent = `/ ${total} 分`;

  const titleEl = document.getElementById("r-title");
  const subEl = document.getElementById("r-sub");
  const emojiEl = document.getElementById("r-emoji");
  if (stars === 3) { emojiEl.textContent = "🏆"; titleEl.textContent = "完美晒！"; subEl.textContent = "全部都答啱，太犀利啦！"; burstConfettiBig(); }
  else if (stars === 2) { emojiEl.textContent = "🎉"; titleEl.textContent = "做得好好！"; subEl.textContent = "差少少就滿分啦，加油！"; }
  else if (stars === 1) { emojiEl.textContent = "💪"; titleEl.textContent = "完成挑戰"; subEl.textContent = "繼續練習會更加熟練！"; }
  else { emojiEl.textContent = "📖"; titleEl.textContent = "加油呀"; subEl.textContent = "溫多次就會進步！"; }

  const starsEl = document.getElementById("r-stars");
  starsEl.innerHTML = "";
  for (let i = 0; i < 3; i++) {
    const s = document.createElement("div");
    s.className = "star" + (i < stars ? " earned" : "");
    s.textContent = i < stars ? "⭐" : "☆";
    starsEl.appendChild(s);
  }
}

// ============================================================
// VIEW SWITCH
// ============================================================
function showView(id) {
  ["home-view", "vocab-view", "study-view", "game-view", "result-view"].forEach(v => {
    document.getElementById(v).classList.toggle("hidden", v !== id);
  });
  window.scrollTo(0, 0);
}
function goHome() { showView("home-view"); renderHome(); }

// ============================================================
// CONFETTI
// ============================================================
const COLORS = ["#5f9e63","#e08a4e","#f2c14e","#6a9bcc","#d9663f","#8a76c4","#4ecdc4"];
function burstConfetti(el) {
  const r = el.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  for (let i = 0; i < 12; i++) {
    const p = document.createElement("div");
    p.className = "confetti-piece";
    p.style.left = cx + "px"; p.style.top = cy + "px";
    p.style.background = COLORS[i % COLORS.length];
    p.style.borderRadius = Math.random() > 0.5 ? "50%" : "2px";
    document.body.appendChild(p);
    const angle = (Math.PI * 2 * i) / 12, dist = 60 + Math.random() * 50;
    p.animate([
      { transform: "translate(-50%,-50%) rotate(0)", opacity: 1 },
      { transform: `translate(calc(-50% + ${Math.cos(angle)*dist}px), calc(-50% + ${Math.sin(angle)*dist}px)) rotate(${360+Math.random()*360}deg)`, opacity: 0 }
    ], { duration: 700, easing: "cubic-bezier(0.16,1,0.3,1)" });
    setTimeout(() => p.remove(), 720);
  }
}
function burstConfettiBig() {
  for (let i = 0; i < 60; i++) {
    const p = document.createElement("div");
    p.className = "confetti-piece";
    p.style.left = (Math.random() * 100) + "vw"; p.style.top = "-20px";
    p.style.background = COLORS[i % COLORS.length];
    p.style.borderRadius = Math.random() > 0.5 ? "50%" : "2px";
    p.style.width = (6 + Math.random() * 6) + "px";
    p.style.height = (8 + Math.random() * 10) + "px";
    document.body.appendChild(p);
    const dx = (Math.random() - 0.5) * 200, dur = 1200 + Math.random() * 800;
    p.animate([
      { transform: "translate(0,0) rotate(0)", opacity: 1 },
      { transform: `translate(${dx}px, ${window.innerHeight + 50}px) rotate(${360*3}deg)`, opacity: 0.6 }
    ], { duration: dur, easing: "cubic-bezier(0.16,1,0.3,1)" });
    setTimeout(() => p.remove(), dur + 100);
  }
}

  if (confirm("要離開呢個挑戰嗎？")) showView("vocab-view");
});
document.getElementById("back-home").addEventListener("click", goHome);
document.getElementById("back-home-2").addEventListener("click", goHome);

document.getElementById("reset-btn").addEventListener("click", () => {
  if (confirm("確定要重設所有星星嗎？")) {
    try { localStorage.removeItem(STORE_KEY); } catch {}
    renderHome();
  }
});
